<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Carte de chaleur eye-tracking</title>
  <desc id="desc">Interface e-commerce simplifiee avec zones chaudes montrant l'attention visuelle sur le titre, l'image produit et le bouton d'achat.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <rect x="140" y="70" width="680" height="400" rx="10" fill="#fff" stroke="#4f5d5f" stroke-width="5"/>
  <rect x="185" y="120" width="280" height="230" fill="#e8e4d8" stroke="#adb8ba" stroke-width="3"/>
  <rect x="510" y="125" width="230" height="28" fill="#cfd8d6"/><rect x="510" y="175" width="270" height="18" fill="#dde4e2"/>
  <rect x="510" y="215" width="245" height="18" fill="#dde4e2"/><rect x="510" y="285" width="170" height="54" rx="8" fill="#2f6f73"/>
  <text x="595" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#fff">Action</text>
  <g opacity=".78">
    <circle cx="610" cy="140" r="72" fill="#f2b84b"/><circle cx="610" cy="140" r="42" fill="#d75f3f"/><circle cx="610" cy="140" r="18" fill="#7a2d2d"/>
    <circle cx="325" cy="235" r="92" fill="#f2b84b"/><circle cx="325" cy="235" r="54" fill="#d75f3f"/><circle cx="325" cy="235" r="24" fill="#7a2d2d"/>
    <circle cx="585" cy="310" r="68" fill="#f2b84b"/><circle cx="585" cy="310" r="36" fill="#d75f3f"/>
  </g>
  <text x="480" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">Les zones chaudes revelent les chemins d'attention.</text>
</svg>
