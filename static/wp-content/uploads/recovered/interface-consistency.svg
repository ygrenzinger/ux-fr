  <path d="M150 420h660" stroke="#2f6f73" stroke-width="8" stroke-linecap="round"/><path d="M810 420l-42-28v56z" fill="#2f6f73"/>
  <text x="480" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">Meme structure, moins d'apprentissage.</text>
</svg>
