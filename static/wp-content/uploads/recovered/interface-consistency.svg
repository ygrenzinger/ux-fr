    <rect x="90" y="120" width="230" height="250" rx="10" fill="#fff"/><rect x="365" y="120" width="230" height="250" rx="10" fill="#fff"/><rect x="640" y="120" width="230" height="250" rx="10" fill="#fff"/>
  </g>
  <g fill="#e8e4d8"><rect x="90" y="120" width="230" height="42" rx="10"/><rect x="365" y="120" width="230" height="42" rx="10"/><rect x="640" y="120" width="230" height="42" rx="10"/></g>
  <g fill="#2f6f73"><circle cx="120" cy="142" r="7"/><circle cx="145" cy="142" r="7"/><circle cx="170" cy="142" r="7"/><circle cx="395" cy="142" r="7"/><circle cx="420" cy="142" r="7"/><circle cx="445" cy="142" r="7"/><circle cx="670" cy="142" r="7"/><circle cx="695" cy="142" r="7"/><circle cx="720" cy="142" r="7"/></g>
