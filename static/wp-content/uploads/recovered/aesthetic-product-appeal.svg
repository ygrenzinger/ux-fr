  <circle cx="340" cy="370" r="16" fill="#b7c7c9"/>
  <rect x="525" y="145" width="150" height="210" rx="10" fill="#eef2ef"/>
  <g fill="#f2b84b">
    <path d="M205 135l20 42 46 6-34 31 8 45-40-22-40 22 8-45-34-31 46-6z"/>
    <path d="M770 120l16 33 36 5-26 25 6 36-32-17-32 17 6-36-26-25 36-5z"/>
