<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Mapping interrupteurs et lumieres</title>
  <desc id="desc">Les interrupteurs sont disposes comme les zones de lumiere afin de rendre la correspondance evidente.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <rect x="180" y="90" width="580" height="230" rx="14" fill="#fff" stroke="#4f5d5f" stroke-width="5"/>
  <g fill="#f2b84b" stroke="#4f5d5f" stroke-width="4">
    <circle cx="320" cy="165" r="42"/><circle cx="600" cy="165" r="42"/><circle cx="320" cy="265" r="42"/><circle cx="600" cy="265" r="42"/>
  </g>
  <g fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4">
    <rect x="245" y="380" width="90" height="48" rx="8"/><rect x="545" y="380" width="90" height="48" rx="8"/>
    <rect x="245" y="455" width="90" height="48" rx="8"/><rect x="545" y="455" width="90" height="48" rx="8"/>
  </g>
  <g stroke="#2f6f73" stroke-width="5" stroke-dasharray="8 8"><line x1="320" y1="305" x2="290" y2="380"/><line x1="600" y1="305" x2="590" y2="380"/></g>
  <text x="480" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">2D vers 2D : correspondance visible</text>
</svg>
