<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Metaphore de bureau et gravite</title>
  <desc id="desc">Fichiers abstraits qui tombent et s'empilent pour montrer le risque d'importer la gravite physique dans une interface numerique.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <line x1="170" y1="420" x2="790" y2="420" stroke="#4f5d5f" stroke-width="6"/>
  <g fill="#fff" stroke="#4f5d5f" stroke-width="4">
    <rect x="380" y="320" width="110" height="80" rx="8" transform="rotate(-12 435 360)"/>
    <rect x="470" y="305" width="110" height="80" rx="8" transform="rotate(16 525 345)"/>
    <rect x="430" y="230" width="110" height="80" rx="8" transform="rotate(-4 485 270)"/>
    <rect x="520" y="190" width="110" height="80" rx="8" transform="rotate(18 575 230)"/>
  </g>
  <path d="M710 105v230" stroke="#d75f3f" stroke-width="10" stroke-linecap="round"/>
  <path d="M710 335l-34-48h68z" fill="#d75f3f"/>
  <text x="710" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333">gravite</text>
  <text x="480" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">Une metaphore physique peut ajouter des contraintes inutiles.</text>
</svg>
