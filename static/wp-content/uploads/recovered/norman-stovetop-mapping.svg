<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Mapping des plaques de cuisson</title>
  <desc id="desc">Comparaison entre controles alignes ambigus et controles disposes comme les plaques pour rendre l'association naturelle.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <g transform="translate(110 95)">
    <text x="170" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333">Association faible</text>
    <rect x="20" y="40" width="300" height="250" rx="12" fill="#fff" stroke="#4f5d5f" stroke-width="5"/>
    <g fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4"><circle cx="100" cy="120" r="38"/><circle cx="230" cy="120" r="38"/><circle cx="100" cy="220" r="38"/><circle cx="230" cy="220" r="38"/></g>
    <g fill="#d75f3f"><circle cx="60" cy="340" r="18"/><circle cx="120" cy="340" r="18"/><circle cx="180" cy="340" r="18"/><circle cx="240" cy="340" r="18"/></g>
  </g>
  <g transform="translate(540 95)">
    <text x="170" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333">Association naturelle</text>
    <rect x="20" y="40" width="300" height="250" rx="12" fill="#fff" stroke="#4f5d5f" stroke-width="5"/>
    <g fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4"><circle cx="100" cy="120" r="38"/><circle cx="230" cy="120" r="38"/><circle cx="100" cy="220" r="38"/><circle cx="230" cy="220" r="38"/></g>
    <g fill="#2f6f73"><circle cx="100" cy="330" r="18"/><circle cx="230" cy="330" r="18"/><circle cx="100" cy="390" r="18"/><circle cx="230" cy="390" r="18"/></g>
  </g>
  <text x="480" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">La disposition des controles doit correspondre a l'objet controle.</text>
</svg>
