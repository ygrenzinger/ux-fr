<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Les sept etapes de l'action</title>
  <desc id="desc">Cycle de Norman en sept etapes, de la definition du but a l'evaluation du resultat.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <circle cx="480" cy="270" r="185" fill="none" stroke="#adb8ba" stroke-width="6"/>
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#333">
    <g><circle cx="480" cy="75" r="42" fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4"/><text x="480" y="82">But</text></g>
    <g><circle cx="640" cy="150" r="42" fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4"/><text x="640" y="157">Intention</text></g>
    <g><circle cx="690" cy="320" r="42" fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4"/><text x="690" y="313">Specifier</text><text x="690" y="337">agir</text></g>
    <g><circle cx="560" cy="440" r="42" fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4"/><text x="560" y="447">Executer</text></g>
    <g><circle cx="400" cy="440" r="42" fill="#eef2ef" stroke="#4f5d5f" stroke-width="4"/><text x="400" y="447">Percevoir</text></g>
    <g><circle cx="270" cy="320" r="42" fill="#eef2ef" stroke="#4f5d5f" stroke-width="4"/><text x="270" y="327">Interpreter</text></g>
    <g><circle cx="320" cy="150" r="42" fill="#eef2ef" stroke="#4f5d5f" stroke-width="4"/><text x="320" y="157">Evaluer</text></g>
  </g>
  <path d="M526 85c55 20 95 55 120 105M682 195c35 55 42 112 20 170M658 365c-35 52-82 85-142 98M435 464c-62-10-112-40-150-88M255 274c5-65 33-118 85-160" fill="none" stroke="#2f6f73" stroke-width="6" stroke-linecap="round"/>
  <text x="480" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">action</text>
</svg>
