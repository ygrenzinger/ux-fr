<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Modeles conceptuels en design</title>
  <desc id="desc">Le modele du designer et le modele de l'utilisateur sont relies par l'image visible du systeme.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <g fill="#fff" stroke="#4f5d5f" stroke-width="5">
    <rect x="90" y="190" width="220" height="120" rx="14"/><rect x="390" y="175" width="180" height="150" rx="14"/><rect x="660" y="190" width="220" height="120" rx="14"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="middle">
    <text x="200" y="240">Modele</text><text x="200" y="272">du designer</text>
    <text x="480" y="238">Image</text><text x="480" y="270">du systeme</text>
    <text x="770" y="240">Modele</text><text x="770" y="272">utilisateur</text>
  </g>
  <path d="M310 250h80M570 250h90" stroke="#2f6f73" stroke-width="8" stroke-linecap="round"/>
  <path d="M390 250l-34-22v44zM660 250l-34-22v44z" fill="#2f6f73"/>
  <text x="480" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">L'apparence et le comportement transmettent le modele.</text>
</svg>
