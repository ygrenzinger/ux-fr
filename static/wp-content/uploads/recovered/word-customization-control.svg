<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Personnalisation et controle</title>
  <desc id="desc">Fenetre de personnalisation abstraite montrant des options choisies par l'utilisateur pour renforcer le controle perçu.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <rect x="180" y="95" width="600" height="350" rx="12" fill="#fff" stroke="#4f5d5f" stroke-width="5"/>
  <rect x="180" y="95" width="600" height="55" rx="12" fill="#e8e4d8"/>
  <text x="480" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333">Personnaliser l'interface</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#333">
    <rect x="235" y="190" width="28" height="28" rx="4" fill="#2f6f73"/><path d="M241 204l9 9 20-22" fill="none" stroke="#fff" stroke-width="4"/><text x="285" y="213">Afficher la barre d'outils</text>
    <rect x="235" y="250" width="28" height="28" rx="4" fill="#2f6f73"/><path d="M241 264l9 9 20-22" fill="none" stroke="#fff" stroke-width="4"/><text x="285" y="273">Choisir les commandes visibles</text>
    <rect x="235" y="310" width="28" height="28" rx="4" fill="#fff" stroke="#7c898b" stroke-width="3"/><text x="285" y="333">Masquer les fonctions rares</text>
  </g>
  <rect x="560" y="365" width="150" height="50" rx="8" fill="#2f6f73"/><text x="635" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#fff">Appliquer</text>
</svg>
