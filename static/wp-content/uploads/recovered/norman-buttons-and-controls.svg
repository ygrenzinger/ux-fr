<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Groupement des boutons et codes de forme</title>
  <desc id="desc">Boutons groupes par fonction avec formes et positions coherentes pour reduire les erreurs.</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <rect x="170" y="95" width="620" height="350" rx="18" fill="#fff" stroke="#4f5d5f" stroke-width="5"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#333" text-anchor="middle">
    <text x="325" y="150">Navigation</text><text x="635" y="150">Actions</text>
  </g>
  <g fill="#e8e4d8" stroke="#4f5d5f" stroke-width="4">
    <circle cx="325" cy="245" r="42"/><circle cx="240" cy="245" r="34"/><circle cx="410" cy="245" r="34"/>
    <rect x="565" y="205" width="130" height="55" rx="10"/><rect x="565" y="290" width="130" height="55" rx="10"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#333" text-anchor="middle">
    <text x="325" y="252">OK</text><text x="240" y="252">◀</text><text x="410" y="252">▶</text><text x="630" y="240">Valider</text><text x="630" y="325">Annuler</text>
  </g>
  <path d="M480 185v210" stroke="#adb8ba" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="480" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">La forme, le groupe et la position guident l'action.</text>
</svg>
